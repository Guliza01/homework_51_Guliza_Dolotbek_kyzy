<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Cat stats</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row g-4 align-items-center">
            <div class="col-3">
                <img src="{{ img }}" class="card-img-top  rounded-4" alt="cat">
            </div>

            <div class="col-8 ms-4">
                <div class="c-body">
                    <p class="card-text fs-5 mt-2 mb-4">
                        Кот: {{ name }}
                    </p>
                    <p class="card-text fs-5 mt-2 mb-4">
                        Возраст: {{ age }}
                    </p>
                    <p class="card-text fs-5 mt-2 mb-4">
                        Уровень счастья: {{ happiness }}
                    </p>
                    <p class="card-text fs-5 mt-2 mb-4">
                        Уровень сытости: {{ satiety }}
                    </p>
                </div>
            </div>
        </div>
    </div>


    <div class="container mt-5">
        <div class="col-5">
            <form method="POST" action="/cat_stats/">
                {% csrf_token %}
                 <input type="hidden" name="name" value="{{ name }}">
                <select class="form-select" name="action" required>
                  <option selected>Выберите действие</option>
                  <option value="play">Поиграть с котом</option>
                  <option value="feed">Покормить кота</option>
                  <option value="sleep">Уложить спать кота</option>
                </select>
                <button type="submit" class="btn btn-secondary mt-5 text-center">Подтвердить</button>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
