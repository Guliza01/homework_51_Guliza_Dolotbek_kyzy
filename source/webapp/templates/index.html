<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Home</title>
</head>
<body>

    <div  class="d-flex align-items-center justify-content-center vh-100 bg-light text-center">
        <div class="cover-container w-100 p-3 mx-auto flex-column" style="max-width: 600px;">
            <h1 class="cover-heading fw-bold mb-4">Вас приветствует симулятор кота</h1>
            <form method="POST" action="/cat_stats/">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="CatNameInput" class="form-label fs-4 mb-3">
                        Для начала введите имя кота
                    </label>
                    <input type="text" class="form-control form-control-lg mx-auto" name="name" id="CatNameInput" placeholder="введите имя кота" required>
                </div>
                <button type="submit" class="btn btn-lg btn-secondary px-4">Создать</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
